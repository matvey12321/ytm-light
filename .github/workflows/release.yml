name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Fetch downloader sidecars
        run: npm run fetch:sidecars

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version v$version."
          }

      - name: Build unsigned installer
        run: npm run build:unsigned

      - uses: actions/upload-artifact@v7
        with:
          name: ytm-light-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' |
            Select-Object -First 1
          if (-not $asset) {
            throw 'Installer not found.'
          }
          gh release create $tag $asset.FullName `
            --title "YTM Light $tag" `
            --notes-file CHANGELOG.md `
            --verify-tag
